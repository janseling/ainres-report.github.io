<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>站内检索 · AI 情报日报</title>
<style>
:root{--bg:#0c0d10;--ink:#eceef1;--ink2:#b6bac2;--dim:#6d7280;--line:#1d1f24;--line2:#2a2d34;--amber:#e8a33d;--green:#8cc07a;--mono:ui-monospace,Menlo,monospace;--sans:-apple-system,"PingFang SC",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 60px}
.mh{padding:30px 0 18px;border-bottom:1px solid var(--line)}
.mh h1{font-size:20px;font-weight:800;letter-spacing:.04em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mh .sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.2em;font-weight:400}
.mh .back{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;float:right;margin-top:6px}
.mh .back:hover{color:var(--amber)}
.ctr{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 6px}
.ipt{background:transparent;border:1px solid var(--line2);color:var(--ink);font-family:var(--sans);font-size:13px;padding:7px 11px;border-radius:4px;min-width:0}
.ipt:focus{outline:none;border-color:rgba(232,163,61,.55)}
.kw{flex:1 1 220px}
.sel{font-size:12.5px;padding:7px 8px;border-radius:4px;background:var(--bg);color:var(--ink2);border:1px solid var(--line2)}
.ents{padding:10px 0 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ents .lb{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-right:2px}
.echip{font-family:var(--mono);font-size:11px;color:var(--ink2);border:1px solid var(--line2);padding:3px 10px;border-radius:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.echip:hover{color:var(--amber);border-color:rgba(232,163,61,.45)}
.echip.on{color:var(--amber);border-color:rgba(232,163,61,.6);background:rgba(232,163,61,.08)}
.meta{font-family:var(--mono);font-size:11px;color:var(--dim);padding:12px 0 10px}
.rw{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 10px}
.rw:hover{border-color:var(--amber)}
.rw-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim)}
.b{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);color:var(--ink2);padding:1px 7px;border-radius:3px;white-space:nowrap}
.bA{color:var(--green);border-color:rgba(140,192,122,.5)}
.bH{color:var(--amber);border-color:rgba(232,163,61,.5)}
.bL{color:#c07a7a;border-color:rgba(192,122,122,.5)}
.rw-t{font-size:15px;font-weight:700;margin:6px 0 3px;line-height:1.5}
.rw-t a{color:var(--ink);text-decoration:none}
.rw-t a:hover{color:var(--amber);text-decoration:underline;text-underline-offset:3px}
.rw-s{color:var(--ink2);font-size:12.5px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rw-e{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.none{padding:44px 0;text-align:center;color:var(--dim);font-family:var(--mono);font-size:13px}
.sfoot{margin-top:26px;padding:16px 0 0;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
.sfoot a{color:var(--dim);text-decoration:none}
.sfoot a:hover{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
<div class="mh">
  <a class="back" href="/">← 归档</a>
  <h1>站内检索 <span class="sub" id="sub">SEARCH · 加载中…</span></h1>
</div>
<div class="ctr">
  <input class="ipt kw" id="kwin" placeholder="关键词：标题 / 摘要 / 实体…" aria-label="关键词">
  <select class="sel" id="ftysel" aria-label="类型"></select>
  <select class="sel" id="fcsel" aria-label="置信度"></select>
  <select class="sel" id="ftnsel" aria-label="源级"></select>
  <select class="sel" id="fdsel" aria-label="日期范围">
    <option value="0">全部日期</option><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option>
  </select>
</div>
<div class="ents" id="echips"></div>
<div class="meta" id="meta">加载检索索引…</div>
<div id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const USP = new URLSearchParams(location.search);
const qs = { e: (USP.get('e') || '').trim(), q: (USP.get('q') || '').trim() };
let IDX = null;
function popSel(sel, arr, label){
  sel.innerHTML = '';
  const o = document.createElement('option'); o.value = ''; o.textContent = label; sel.appendChild(o);
  arr.forEach(x => { const oo = document.createElement('option'); oo.value = x; oo.textContent = x; sel.appendChild(oo); });
}
function entHref(n){ return 'search.html?e=' + encodeURIComponent(n); }
function render(){
  if(!IDX) return;
  const kw = $('kwin').value.trim();
  const fty = $('ftysel').value, fcn = $('fcsel').value, ftn = $('ftnsel').value, fd = $('fdsel').value;
  const cur = (+fd) ? new Date(Date.now() - (+fd) * 864e5).toISOString().slice(0, 10) : '';
  const hits = IDX.rows.filter(r => {
    if(qs.e && (('|' + r.e + '|').indexOf('|' + qs.e + '|')) < 0) return false;
    if(kw){ const hay = (r.ti + ' ' + (r.su || '') + ' ' + (r.e || '')).toLowerCase(); if(hay.indexOf(kw.toLowerCase()) < 0) return false; }
    if(fty && (('|' + r.ty + '|').indexOf('|' + fty + '|')) < 0) return false;
    if(fcn && r.c !== fcn) return false;
    if(ftn && r.tn !== ftn) return false;
    if(cur && r.d < cur) return false;
    return true;
  });
  $('meta').textContent = '命中 ' + hits.length + ' / ' + IDX.rows.length + ' 条' + (qs.e ? ' · 实体：' + qs.e : '') + (hits.length > 200 ? '（仅展示前 200）' : '');
  const list = $('list');
  if(!hits.length){ list.innerHTML = '<div class="none">无命中——换个关键词或放宽筛选</div>'; return; }
  list.innerHTML = hits.slice(0, 200).map(r => {
    const tyB = (r.ty || '').split('|').filter(Boolean).map(t => '<span class="b">' + esc(t) + '</span>').join('');
    const tnB = r.tn ? '<span class="b' + (r.tn === 'A' ? ' bA' : '') + '">源 ' + esc(r.tn) + '</span>' : '';
    const ck = r.c === '高' ? 'b bH' : (r.c === '低' ? 'b bL' : 'b');
    const ccB = r.c ? '<span class="' + ck + '">' + esc(r.c) + '</span>' : '';
    const es = (r.e || '').split('|').filter(Boolean).slice(0, 6).map(n => '<a class="echip" href="' + entHref(n) + '">' + esc(n) + '</a>').join('');
    return '<div class="rw">' +
      '<div class="rw-h"><span class="b">' + esc(r.d.slice(5)) + '</span>' + tyB + tnB + ccB + '<span style="margin-left:auto">' + esc(r.i) + '</span></div>' +
      '<div class="rw-t"><a href="reports/' + esc(r.i) + '.html#it-' + esc(r.a) + '">' + esc(r.ti) + '</a></div>' +
      (r.su ? '<div class="rw-s">' + esc(r.su) + '</div>' : '') +
      (es ? '<div class="rw-e">' + es + '</div>' : '') +
      '</div>';
  }).join('');
}
function initPage(){
  fetch('reports/search-index.json?v=' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)))
    .then(d => {
      IDX = d;
      const nIss = new Set(d.rows.map(r => r.i)).size;
      $('sub').textContent = 'SEARCH · ' + nIss + ' 期 / ' + d.rows.length + ' 条';
      popSel($('ftysel'), d.types || [], '全部类型');
      popSel($('fcsel'), ['高','中','低'], '全部置信');
      popSel($('ftnsel'), ['A','B','C','D'], '全部源级');
      const box = $('echips'); box.innerHTML = '<span class="lb">热门实体</span>';
      (d.ents || []).slice(0, 18).forEach(z => {
        const a = document.createElement('a'); a.className = 'echip'; a.href = entHref(z.n);
        a.textContent = z.n + '·' + z.c;
        box.appendChild(a);
      });
      if(qs.e){ const c = document.createElement('a'); c.className = 'echip on'; c.href = 'search.html'; c.textContent = '✕ 实体：' + qs.e; box.appendChild(c); }
      if(qs.q){ $('kwin').value = qs.q; }
      ['ftysel','fcsel','ftnsel','fdsel'].forEach(id => { $(id).addEventListener('change', render); });
      $('kwin').addEventListener('input', render);
      render();
    })
    .catch(e => { $('meta').textContent = '⚠️ 检索索引加载失败（' + e.message + '），稍后刷新重试'; });
}
initPage();
</script>
<footer class="sfoot"><a href="/api.html">API · 字段说明</a><a href="/rss.xml" target="_blank" rel="noopener">RSS 订阅 ↗</a><a href="https://github.com/janseling" target="_blank" rel="noopener">github/janseling</a></footer>
</body>
</html>
