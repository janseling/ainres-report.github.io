    return;
  }
  let manifest;
  try{
    const r = await fetch('reports/index.json?v=' + Date.now());
    if(!r.ok) throw new Error('manifest ' + r.status);
    manifest = await r.json();
  }catch(e){
    document.getElementById('loadmsg').innerHTML = '⚠️ 索引加载失败（' + esc(e.message) + '）<br><br><a href="./">返回归档</a>';
    return;
  }
  const rs = manifest.reports || [];
  if(!rs.length){ document.getElementById('loadmsg').textContent = '归档为空'; return; }
  let idx = rs.findIndex(x => x.id === wantId);
  if(idx < 0) idx = 0;
  const meta = rs[idx];
  let rep;
  try{
    const r = await fetch('reports/' + meta.id + '.json?v=' + Date.now());
    if(!r.ok) throw new Error(r.status);
    rep = await r.json();
  }catch(e){
    document.getElementById('loadmsg').innerHTML = '⚠️ 报告数据加载失败（' + esc(e.message) + '）<br><br><a href="./">返回归档</a>';
    return;
  }
  render(rep, rs, idx);
}

function render(rep, rs, idx, ctx){
  if(!window.__PAGE_DATA__) document.title = rep.title + ' · AI 情报';
  const no = ctx ? ctx.no : String(rs.length - idx).padStart(2,'0');
  const newer = ctx ? ctx.newer : rs[idx-1];
  const older = ctx ? ctx.older : rs[idx+1];
  const setPager = (id, el) => { const a = document.getElementById(el); if(id){ a.href = repUrl(id); } else { a.disabled = true; a.removeAttribute('href'); } };
  setPager(newer && newer.id, 'tbNext'); setPager(older && older.id, 'tbPrev');

  const notesHtml = (rep.notes||[]).map(n=>`<span class="note">※ ${esc(n)}</span>`).join('');
  const chips = [];
  chips.push(`<span class="mchip">本期 <b>${rep.itemCount}</b> 条</span>`);
  if(rep.rawStats && rep.rawStats.candidates) chips.push(`<span class="mchip">候选 <b>${rep.rawStats.candidates.toLocaleString()}</b></span>`);
  if((rep.signals||[]).length) chips.push(`<span class="mchip">跟踪信号 <b>${rep.signals.length}</b></span>`);

  const secsHtml = (rep.sections||[]).map((sec, si)=>{
    const sm = SEC_META[sec.key] || {icon:sec.icon||'📋', zh:sec.title||sec.key};
    const items = sec.items.map((it, ii)=>{
      const main = it.urls && it.urls[0];
      const extraUrls = (it.urls||[]).slice(1).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">另链 ↗</a>`).join('');
      const angles = (it.angles||[]).map(a=>`<div class="angle ${a.kind}"><span class="tag">${a.icon} ${esc(a.label)}</span><span class="txt">${mdLinks(a.text)}</span></div>`).join('');
      return `<article class="item" style="--i:${ii}">
        <div class="i-head"><span class="i-no">${String(ii+1).padStart(2,'0')}</span>
          <h3 class="i-title">${main?`<a href="${esc(main)}" target="_blank" rel="noopener">${esc(it.title)}</a><span class="ext">↗</span>`:esc(it.title)}</h3></div>
        ${it.meta?`<div class="i-meta"><span class="src">${esc(it.meta)}</span></div>`:''}
        ${it.summary?`<p class="i-summary">${mdLinks(it.summary)}</p>`:''}
        ${(it.urls||[]).length>1?`<div class="i-urls"><span class="tag"></span>${extraUrls}</div>`:''}
        ${angles?`<div class="angles">${angles}</div>`:''}
      </article>`;
    }).join('');
    return `<section id="sec-${esc(sec.key)}">
      <div class="sec-h"><span class="no">0${si+1}</span><h2>${sm.icon} ${esc(sm.zh)}</h2><span class="n">${sec.items.length} 条</span></div>
      ${items}
    </section>`;
  }).join('');

  const navChips = (rep.sections||[]).map(s=>{
      const sm = SEC_META[s.key]||{icon:s.icon||'📋',zh:s.title};
      return `<a class="nchip" href="#sec-${esc(s.key)}">${sm.icon} ${esc((sm.zh||'').split(' / ')[0])} ${s.items.length}</a>`;
    }).join('');

  const sigHtml = (rep.signals||[]).map((s,i)=>`<div class="sig"><span class="sno">${String(i+1).padStart(2,'0')}</span><div class="body"><b>${esc(s.lead)}</b>${mdLinks(s.text)}</div></div>`).join('');
  const ovHtml = (rep.overview||[]).map(o=>`<div class="ov-item">${mdLinks(o)}</div>`).join('');

  document.getElementById('wrap').innerHTML = `
  <header class="masthead">
    <div class="crumb"><span>AI INTEL DAILY</span><span>·</span><span class="no">NO.${no}</span><span>·</span><span>${esc(rep.date)} ${esc(rep.time)} CST</span></div>
    <h1 class="title">${esc(rep.title.replace(/^AI 情报 · /,'').replace(' 场',' 场'))}</h1>
    <span class="stamp">已归档 ✓</span>
    <blockquote class="cov">${esc(rep.coverage)}${notesHtml}</blockquote>
    <div class="mchips">${chips.join('')}</div>
    <div class="navchips">${navChips}</div>
  </header>
  ${(rep.overview||[]).length?`<section id="sec-overview"><div class="sec-h"><span class="no">🔭</span><h2>速览</h2><span class="n">${rep.overview.length} 条</span></div><div class="ovlist">${ovHtml}</div></section>`:''}
  ${(rep.signals||[]).length?`<section id="sec-signals"><div class="sec-h"><span class="no">🧭</span><h2>值得跟踪的信号</h2><span class="n">${rep.signals.length} 条</span></div><div class="signals">${sigHtml}</div></section>`:''}
  ${secsHtml || '<div class="msg">本期无条目</div>'}
  ${rep.rawStats && rep.rawStats.candidates?`<div class="rawline">▸ raw archive: reports/raw/${esc(rep.id)}.json（候选 ${rep.rawStats.candidates.toLocaleString()}${rep.rawStats.selected?'／入选 '+rep.rawStats.selected:''}）</div>`:''}
  <nav class="pager">
    ${older?`<a href="${repUrl(esc(older.id))}">‹ ${esc(older.date.slice(5))} ${esc(older.time)}</a>`:'<a disabled>‹ 已是早期</a>'}
    <a href="./" style="border:none">☰ 归档</a>
    ${newer?`<a href="${repUrl(esc(newer.id))}">${esc(newer.date.slice(5))} ${esc(newer.time)} ›</a>`:'<a disabled>已是最新 ›</a>'}
  </nav>`;
}
init();
</script>
</body>
</html>
