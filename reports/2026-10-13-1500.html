const SIGRE = /SIG-(\d{4})(\d{2})(\d{2})-(\d{4})-(\d+)/g;

const SIGTAKEN = Object.create(null);

    const slug = 'sig-'+y+mo+dd+'-'+tm+'-'+n;

const URL_RE = /https?:\/\/[^\s，。；、）)<>"]+/g;

const SLINK_RE = /(^|[^\w/@.:-])((?:[a-z0-9-]+\.)+[a-z0-9]{2,10}\/[^\s，。；、）)<>",]*)/g;
const fixSchemeless = s => String(s).replace(SLINK_RE, (m, lead, rest) => lead + 'https://' + rest);
function verifyFmt(note){
  const s = fixSchemeless(note);
  const urls = s.match(URL_RE) || [];
  if (!urls.length) return esc(s);
  if (urls.length > 1) return esc(s).replace(URL_RE, um => domPill(um));
  const u = urls[0], i = s.indexOf(u);
  let head = s.slice(0, i);
  head = head.trimEnd();
  if (head.endsWith(';') || head.endsWith('；')) head = head.slice(0, -1).trimEnd();

      const C3 = { '高':'hi', '中':'md', '低':'lo' };
      const v3chips = [];
      if (it.confidence) v3chips.push(`<span class="chip c3 ${C3[it.confidence]||''}">● ${esc(it.confidence)}${it.confidence_note?` · ${esc(it.confidence_note)}`:''}</span>`);
      if (it.source_tier){ const tz = TIER_ZH[it.source_tier] || (it.source_tier + '级源');
        v3chips.push(`<span class="chip s3"${TIER_TIP[it.source_tier]?` title="${esc(TIER_TIP[it.source_tier])}"`:''}>${esc(tz)}</span>`); }
      (it.type_tags||[]).forEach(t=>v3chips.push(`<span class="chip t3">${esc(t)}</span>`));
      if (it.snapshot) v3chips.push(`<span class="chip x3" title="${esc(it.snapshot.file)}">快照 ✓</span>`);
      if ((it.entities||[]).length) v3chips.push(`<span class="chip e3">实体: ${esc(it.entities.map(e=>e.name).join(' / '))}</span>`);
      const v3html = v3chips.length?`<div class="i-v3">${v3chips.join('')}</div>`:'';
      const provBits = [];
      const pv = it.provenance || {};
      if (pv.raw_ref || pv.source_id) provBits.push(`<span>溯源 ${esc(pv.raw_ref || '—')}${pv.source_name?` · 源 ${esc(pv.source_name)}`:''}</span>`);
      if (it.snapshot) provBits.push(`<span>原文快照 ✓ ${esc(it.snapshot.file)} · sha256 ${(it.snapshot.sha256||'').slice(0,8)}</span>`);
      if (it.original_title) provBits.push(`<span>原题：${esc(it.original_title)}</span>`);
      const provHtml = provBits.length?`<details class="prov"><summary>证据链 ▾</summary><div class="prov-body">${provBits.join('')}</div></details>`:'';
      const verParts = [];
      if (it.verify_note) verParts.push(verifyFmt(it.verify_note));
      (it.urls||[]).slice(1).forEach(u=>verParts.push(domPill(u)));
      const verHtml = verParts.length?`<div class="i-verify">✓ 外部佐证：${verParts.join(' · ')}</div>`:'';

      return `<article class="item" id="it-${esc(sec.key)}-${ii}" style="--i:${ii}">
        <h3 class="i-title">${main?`<a href="${esc(main)}" target="_blank" rel="noopener">${esc(it.title)}</a><a class="ext" href="${esc(main)}" target="_blank" rel="noopener">原文 ↗</a>`:esc(it.title)}</h3>
        ${it.meta?`<div class="i-meta">${esc(it.meta)}${it.event_time?` ｜ ${it.event_time_inferred?'~ ':''}事件 ${esc(it.event_time)}${it.event_time_inferred?'（推断）':''}`:''}</div>`:''}
        ${v3html}
        ${it.summary?`<div class="i-summary">${sigLink(it.summaryHtml || mdLinks(it.summary))}</div>`:''}
        ${angles?`<div class="angles">${angles}</div>`:''}
        ${verHtml}${provHtml}
      </article>`;
    }).join('');
    return `<section id="sec-${esc(sec.key)}">
      <div class="sec-h"><span class="no">0${si+1}</span><h2>${sm.icon} ${esc(sm.zh)}</h2><span class="n">${sec.items.length} 条</span></div>
      ${items}
    </section>`;
  }).join('');

  const navChips = (rep.sections||[]).map(s=>{
      const sm = SEC_META[s.key]||{icon:s.icon||'📋',zh:s.title};
      return `<a class="nchip" href="#sec-${esc(s.key)}">${sm.icon} ${esc((sm.zh||'').split(' / ')[0])} ${s.items.length}</a>`;
    }).join('');

  const grams2 = s => { s = String(s).toLowerCase().replace(/\s+/g,''); const a=[]; for(let i=0;i<=s.length-2;i++)a.push(s.slice(i,i+2)); return a; };
  const anchorOf = ovText => {
    const ovn = String(ovText).toLowerCase().replace(/\s+/g,'');
    if(!ovn || !ovn.length || !(rep.sections||[]).length) return null;
    let best=null, bestScore=0;
    (rep.sections||[]).forEach(sec=>(sec.items||[]).forEach((it,ii)=>{
      const tg=grams2(it.title||''); if(tg.length<4) return;
      let hits=0; tg.forEach(g=>{ if(ovn.includes(g)) hits++; });
      const sc=hits/tg.length;
      if(sc>bestScore){bestScore=sc;best=sec.key+'-'+ii;}
    }));
    return bestScore>=0.4?best:null;
  };
    /* 速览与跟踪信号合并：分句 2-gram 双向相似度 ≥0.38 去重；锚定=标题@0.4 优先，标记/追加行用 标题+原题+摘要 分句兜底 @0.3 */
  const normT = s => grams2(s).join('');
  const CLAUSE_RE = new RegExp('[；;。]');
  const SIG_TH = 0.38;
  const rowsClauses = t => String(t).split(CLAUSE_RE).map(c=>c.trim()).filter(c=>c).map(c=>({ n:normT(c), g:grams2(c) }));
  const itemIdx = [];
  (rep.sections||[]).forEach(sec=>(sec.items||[]).forEach((it,ii)=>{
    const hay = (it.title||'') + '；' + (it.original_title||'') + '；' + (it.summary||'');
    itemIdx.push({ id: sec.key + '-' + ii, cl: rowsClauses(hay) });
  }));
  const bestItem = text => {
    const tcs = rowsClauses(text);
    let best = null, bs = 0;
    itemIdx.forEach(rec=>{
      let m = 0;
      tcs.forEach(tc=>{
        if(!tc.n) return;
        rec.cl.forEach(ic=>{
          if(!ic.n) return;
          let h1 = 0; tc.g.forEach(g=>{ if(ic.n.indexOf(g) >= 0) h1++; });
          let h2 = 0; ic.g.forEach(g=>{ if(tc.n.indexOf(g) >= 0) h2++; });
          m = Math.max(m, Math.max(tc.g.length? h1/tc.g.length : 0, ic.g.length? h2/ic.g.length : 0));
        });
      });
      if(m > bs){ bs = m; best = rec.id; }
    });
    return best ? { id: best, sc: bs } : null;
  };
  const ovRows = (rep.overview||[]).map(o=>({ text:o, sig:false, anc:null, aScore:0 }));
  const ovClauses = ovRows.map(r=>rowsClauses(r.text));
  (rep.signals||[]).forEach((s,si)=>{
    const blob = (s.lead||'') + '，' + (s.text||'');
    const bn = normT(blob), sb = grams2(blob);
    let bi = -1, bs = 0;
    ovRows.forEach((r,ri)=>{
      ovClauses[ri].forEach(cl=>{
        if(!cl.n) return;
        let h1 = 0; sb.forEach(g=>{ if(cl.n.indexOf(g) >= 0) h1++; });
        let h2 = 0; cl.g.forEach(g=>{ if(bn.indexOf(g) >= 0) h2++; });
        const sc = Math.max(sb.length? h1/sb.length : 0, cl.g.length? h2/cl.g.length : 0);
        if(sc > bs){ bs = sc; bi = ri; }
      });
    });
    if(bi >= 0 && bs >= SIG_TH){
      ovRows[bi].sig = true; if(!ovRows[bi].sigSeq){ ovRows[bi].sigSeq = si+1; ovRows[bi].sigId = s.sigId; } ovRows[bi].sigLead = s.lead || ''; ovRows[bi].sigText = s.text || '';
      if(ovRows[bi].aScore < 0.3){
        const b = bestItem(blob);
        if(b && b.sc > ovRows[bi].aScore){ ovRows[bi].anc = b.id; ovRows[bi].aScore = b.sc; }
      }
    } else {
      const t = (s.lead? s.lead + '：' : '') + (s.text||'');
      const b = bestItem(t);
      const anc = (b && b.sc >= 0.3) ? b.id : null;
      const asc = (b && b.sc >= 0.3) ? b.sc : 0;
      ovRows.push({ text:t, sig:true, sigSeq:si+1, sigId:s.sigId, sigLead:s.lead || '', sigText:s.text || '', anc:anc, aScore:asc });
      ovClauses.push(rowsClauses(t));
    }
  });
  const ovHtml = ovRows.map(r=>{
    const a = anchorOf(r.text) || r.anc || null;
  const ownStamp = String(rep.id).replace(/^(\d{4})-(\d{2})-(\d{2})-(\d{4})$/, '$1$2$3-$4');
  const preTaken = {};
  (rep.signals||[]).forEach(s=>{ if(s.sigId) preTaken['sig-' + String(s.sigId).replace('SIG-','')] = 1; });
    const sid = r.sigId ? 'sig-' + String(r.sigId).replace('SIG-','') : (r.sig && r.sigSeq && !preTaken['sig-' + ownStamp + '-' + r.sigSeq] ? 'sig-' + ownStamp + '-' + r.sigSeq : null);
    const cr = (!a && r.sig && older && older.id) ? older.id : null;
    const ct = cr ? (r.text||'') + '；' + (r.sigLead||'') + '；' + (r.sigText||'') : '';
    const mark = r.sig?`<span class="sigtag" title="${esc('值得跟踪：'+(r.sigLead||'跟踪信号'))}">🧭 跟踪</span>`:'';
    return `<div class="ov-item${(a||cr)?' canjump':''}"${sid?` id="${sid}"`:''}${a?` data-jump="it-${esc(a)}"`:''}${cr?` data-cross="${esc(cr)}" data-crosstext="${esc(ct)}"`:''}>${sigLink(mdLinks(r.text))}${mark}${r.sigId?`<span class="fw-star" data-fw="${esc(r.sigId)}" data-name="${esc(r.sigLead||'')}">☆</span>`:''}${a?'<span class="jumptag">条目 ↳</span>':(cr?'<span class="jumptag">上期 ↳</span>':'')}</div>`;
  }).join('');

  document.getElementById('wrap').innerHTML = `
  <header class="masthead">
    <div class="crumb hline"><span class="no">NO.${no}</span><h1 class="title">${esc(rep.date)} ${esc(rep.time)} 场</h1></div>
    <blockquote class="cov">${esc(String(rep.coverage||'').replace(/（[^）]*）$/,''))}</blockquote>
    <div class="navchips">${navChips}</div>
  </header>
  ${ovRows.length?`<section id="sec-overview"><div class="sec-h"><span class="no">🔭</span><h2>速览</h2><span class="n">${ovRows.length} 条</span></div><div class="ovlist">${ovHtml}</div></section>`:''}
  ${secsHtml || '<div class="msg">本期无条目</div>'}
  ${rep.rawStats && rep.rawStats.candidates?`<div class="rawline">▸ raw archive: reports/raw/${esc(rep.id)}.json（候选 ${rep.rawStats.candidates.toLocaleString()}${rep.rawStats.selected?'／入选 '+rep.rawStats.selected:''}）${rep.provenance_meta&&rep.provenance_meta.evidence_file?` · 证据链 ${esc(rep.provenance_meta.evidence_file)}`:''}${rep.provenance_meta&&rep.provenance_meta.snapshot_dir?` · 快照 ${esc(rep.provenance_meta.snapshot_dir)}`:''}</div>`:''}
  <nav class="pager">
    ${older?`<a href="${repUrl(esc(older.id))}">‹ ${esc(older.date.slice(5))} ${esc(older.time)}</a>`:'<a disabled>‹ 已是早期</a>'}
    <a href="/" style="border:none">☰ 首页</a>
    ${newer?`<a href="${repUrl(esc(newer.id))}">${esc(newer.date.slice(5))} ${esc(newer.time)} ›</a>`:'<a disabled>已是最新 ›</a>'}
  </nav>`;
  window.__fwHyd && window.__fwHyd();

  /* 速览行点击：本页锚直接滚；跨期行→拉上一期数据→同款分句匹配→跳上一期条目 */
  const crossJump = (el, cid) => {
    if(el.dataset.bsy) return;
    el.dataset.bsy = '1';
    const jt = el.querySelector('.jumptag');
    const say = msg => { if(jt){ jt.textContent = msg; setTimeout(()=>{ if(jt) jt.textContent = '上期 ↳'; }, 1800); } };
    const base = window.__PAGE_DATA__ ? '' : 'reports/';
    fetch(base + cid + '.json?v=' + Date.now())
      .then(r=>r.ok?r.json():null)
      .then(d=>{
        if(!d || !d.sections){ say('上期数据缺失'); return; }
        const idx2 = [];
        (d.sections||[]).forEach(sec=>(sec.items||[]).forEach((it,ii)=>{
          const hay = (it.title||'') + '；' + (it.original_title||'') + '；' + (it.summary||'');
          idx2.push({ id: sec.key + '-' + ii, cl: rowsClauses(hay) });
        }));
        const tcs = rowsClauses(el.getAttribute('data-crosstext') || '');
        let best = null, bs = 0;
        idx2.forEach(rec=>{
          let m = 0;
          tcs.forEach(tc=>{
            if(!tc.n) return;
            rec.cl.forEach(ic=>{
              if(!ic.n) return;
              let h1 = 0; tc.g.forEach(g=>{ if(ic.n.indexOf(g) >= 0) h1++; });
              let h2 = 0; ic.g.forEach(g=>{ if(tc.n.indexOf(g) >= 0) h2++; });
              m = Math.max(m, Math.max(tc.g.length? h1/tc.g.length : 0, ic.g.length? h2/ic.g.length : 0));
            });
          });
          if(m > bs){ bs = m; best = rec.id; }
        });
        if(best && bs >= 0.3){
          location.href = repUrl(cid) + '#it-' + best;
        } else {
          say('上期未匹配');
        }
      })
      .catch(()=>say('加载失败'))
      .finally(()=>{ el.dataset.bsy = ''; });
  };
  document.querySelectorAll('.ov-item[data-jump], .ov-item[data-cross]').forEach(el=>el.addEventListener('click',ev=>{ if(ev.target.closest('a')||ev.target.closest('.fw-star')) return;
    const hj = el.getAttribute('data-jump');
    if(hj){
      location.hash = hj;
      const t = document.getElementById(hj);
      if(t) t.scrollIntoView({block:'start'});
      return;
    }
    const cid = el.getAttribute('data-cross');
    if(cid) crossJump(el, cid);
  }));
  /* 板块折叠：点板块头切换展开/收起，默认全部展开 */
  document.querySelectorAll("section .sec-h").forEach(secHead=>secHead.addEventListener("click",ev=>{
    if(ev.target.closest("a")) return;
    secHead.parentElement.classList.toggle("collapsed");
  }));
  /* 阅读档位落地（内层重建后重放）+ 带锚直达时滚到条目 */
  modeSet();
  if(location.hash){ const hid=location.hash.replace(/[^#A-Za-z0-9_-]/g,''); const hop=()=>{ const el=document.querySelector(hid); if(el) el.scrollIntoView({block:'start',behavior:'instant'}); }; hop(); [250,900,1600,2600,4000].forEach(ms=>setTimeout(hop,ms)); }
}
(function(){ const ns=document.getElementById('navSearch'); if(ns) ns.href = window.__PAGE_DATA__ ? '../search.html' : 'search.html'; })();
init();
</script>

(function(){
  var b = document.getElementById('toTop'); if(!b) return;
  var tick = function(){ b.classList.toggle('on', (window.scrollY||0) > 360); };
  window.addEventListener('scroll', tick, {passive:true}); tick();
  b.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
})();
