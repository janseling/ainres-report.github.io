<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信号追踪 — AI 情报日报</title>
<meta name="description" content="信号追踪总览：由每日报「继续跟踪」信号自动聚合的信号线，含状态、跟踪期数与最新更新场次。">
<meta property="og:title" content="信号追踪 — AI 情报日报">
<meta property="og:description" content="信号线总览，数据开放（reports/topics.json）。">
<meta property="og:type" content="website">
<style>
:root{--bg:#0c0d10;--panel:#15171e;--panel2:#191c24;--line:#262a33;--line2:#31353f;--ink:#d8d5c9;--ink2:#a5a294;--dim:#77746a;--amber:#e8a33d;--amber2:#f5c069;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.008) 2px 4px),radial-gradient(ellipse 120% 80% at 50% -10%,#13161e 0%,var(--bg) 58%);color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:14.5px;line-height:1.8}
a{color:var(--amber);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.masthead{padding:48px 0 20px}
.brand{display:flex;align-items:baseline;gap:12px;margin:10px 0 0}
.brand h1{margin:0;font-size:30px;letter-spacing:.02em}
.brand em{font-style:normal;color:var(--amber)}
.brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line2);padding:3px 8px;border-radius:3px}
.tagline{color:var(--ink2);max-width:640px;margin:10px 0 0;font-size:13.5px}
.statline{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:10px}
.nvbar{position:sticky;top:0;z-index:20;background:rgba(12,13,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line,#262a33)}
.nvbar .in{width:100%;max-width:1080px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:8px;position:relative}
.tb-brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--dim,#77746a);white-space:nowrap}
.tb-brand b{color:var(--amber,#e8a33d);font-weight:600}
.tb-logo{height:16px;width:16px;border-radius:3px;flex:none;margin-right:5px;vertical-align:-3px}
.nv{display:flex;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:12px;margin-left:auto}
.nv a{color:var(--ink2,#a5a294);text-decoration:none;white-space:nowrap;padding:6px 8px;border-radius:6px}
.nv a:hover{color:var(--amber,#e8a33d)}
.nv a.srch{color:var(--amber2,#f5c069)}
.nv-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line2,#31353f);border-radius:6px;color:var(--ink2,#a5a294);font-size:15px;line-height:1;padding:4px 10px;cursor:pointer}
@media(max-width:720px){
.nv-btn{display:block}
.nv{display:none;position:absolute;top:40px;right:0;left:auto;z-index:90;flex-direction:column;align-items:stretch;background:var(--panel,#15171e);border:1px solid var(--line2,#31353f);border-radius:8px;padding:8px;box-shadow:0 10px 28px rgba(0,0,0,.45);margin-left:0;min-width:200px}
.nv.open{display:flex}
.nv a{padding:8px 12px}
.nv a:hover{background:rgba(232,163,61,.06)}
}

#sigList{padding:6px 0 30px}
.tp-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink)}
.tp-row:hover{background:rgba(232,163,61,.04)}
.tp-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 5px rgba(232,163,61,.7);flex:none;animation:ssp 3s infinite}
.tp-dot.c{background:var(--dim);box-shadow:none;animation:none}
.tp-name{font-size:14px;line-height:1.6;min-width:0}
.tp-new{display:inline-block;background:var(--amber);color:#0c0d10;font-family:var(--mono);font-style:normal;font-size:9px;font-weight:700;letter-spacing:.1em;padding:1px 5px;border-radius:2px;margin-left:8px;vertical-align:1px}
.tp-meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;text-align:right}
.tp-arr{color:var(--dim);flex:none}
.tp-ph{color:var(--dim);font-family:var(--mono);font-size:12px;padding:30px 0}
.foot{border-top:1px solid var(--line);margin-top:30px;padding:18px 0 40px;font-family:var(--mono);font-size:11.5px;display:flex;gap:18px;color:var(--dim)}
.foot a{color:var(--dim);text-decoration:none}
@keyframes ssp{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:720px){.tp-meta{display:none}.brand h1{font-size:24px}}
.foot a:last-child,.sfoot a:last-child{margin-left:auto}
.fw-star{cursor:pointer;font-size:14px;line-height:1;color:var(--dim,#77746a);background:none;border:0;flex:none;padding:0 3px;transition:color .15s,transform .1s;display:inline-block}
.fw-star:hover{color:var(--amber,#e8a33d);transform:scale(1.18)}
.fw-star.fw-on{color:var(--amber,#e8a33d)}
.fw-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel,#15171e);border:1px solid var(--line2,#31353f);color:var(--ink2,#a5a294);font:11.5px/1.5 var(--mono,monospace);padding:10px 14px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:96;opacity:.97;transition:opacity .5s;white-space:nowrap}
.fw-toast.fw-out{opacity:0}
.fw-chip{cursor:pointer;background:var(--panel2,#191c24);border:1px solid var(--line2,#31353f);color:var(--ink2,#a5a294);font:11px/1 var(--mono,monospace);padding:7px 12px;border-radius:999px;letter-spacing:.06em}
.fw-chip.fw-on,.fw-chip:hover{color:var(--amber,#e8a33d);border-color:var(--amber,#e8a33d)}
.tp-row.fw-dead{opacity:.42;cursor:default}
.tp-row .fw-star{padding:0 4px}
@media(max-width:720px){.foot a[href*="github"],.sfoot a[href*="github"]{display:none}}
</style>
</head>
<body>
<div class="nvbar"><div class="in"><a class="tb-brand" href="/" style="text-decoration:none"><img class="tb-logo" src="/icon.png" alt="">AI<b>情报</b>DB</a><nav class="nv" id="nv"><a href="/">首页</a><a href="/api.html">API 字段说明</a><a href="/rss.xml" target="_blank" rel="noopener">RSS 订阅 ↗</a><a href="/about.html">关于</a><a class="srch" href="/search.html">🔍 站内检索</a></nav><button class="nv-btn" id="nvBtn" aria-label="菜单">☰</button></div></div>
<div class="wrap">
  
<header class="masthead">
    <div class="brand"><h1>信号<em>追踪</em></h1><span class="sub">SIGNALS</span></div>
    <p class="tagline">信号线由每日报的「继续跟踪」信号自动聚合——每条线独立成页，收录该线索的全部跟踪节点与关联报道。数据开放：reports/topics.json。</p>
    <div class="statline" id="statline"><span id="sgCount">加载中…</span><button class="fw-chip" id="fwChip" type="button" aria-pressed="false">⭐ 我的关注<span id="fwN"></span></button></div>
  </header>
  <main id="sigList"><div class="tp-ph">加载中…</div></main>
<footer class="foot"><a href="/">首页</a><a href="/api.html">API 字段说明</a><a href="/rss.xml" target="_blank" rel="noopener">RSS 订阅 ↗</a><a href="/about.html">关于</a><a href="/search.html">🔍 站内检索</a><a href="https://github.com/janseling" target="_blank" rel="noopener">github/janseling</a></footer>
</div>
<script>
(function(){
  'use strict';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(t){var p=String(t||'').split('-');if(p.length<4)return String(t||'');return p[1]+'-'+p[2]+' '+String(p[3]).slice(0,2)+':00';}
  fetch('reports/topics.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject(0);}).then(function(d){
    var ch=(d&&d.chains)||[];
    var total=(d&&d.count)||ch.length;
    var srt=ch.slice().sort(function(a,b){
      var ao=a.status==='open'?0:1,bo=b.status==='open'?0:1;
      if(ao!==bo)return ao-bo;
      var A=String(a.latest||''),B=String(b.latest||'');
      return A<B?1:(A>B?-1:0);
    });
    var maxLatest=srt.length?srt[0].latest:'';
    var h='';
    for(var i=0;i<srt.length;i++){
      var c=srt[i];
      var st=c.status||'open';
      h+='<a class="tp-row" href="/topic/'+esc(c.slug)+'.html" data-sig="'+esc(c.id)+'"><span class="fw-star" data-fw="'+esc(c.id)+'" data-name="'+esc(c.name)+'">☆</span><span class="tp-dot'+(st==='open'?'':' c')+'"></span><span class="tp-name">'+esc(c.name)+(c.latest===maxLatest?'<em class="tp-new">New</em>':'')+'</span><span class="tp-meta">'+esc(String(c.nodes||0))+' 期 · 最新 '+fmt(c.latest)+' · 下查 '+esc(String(c.check||'').slice(5))+'</span><span class="tp-arr">→</span></a>';
    }
    document.getElementById('sigList').innerHTML=h||'<div class="tp-ph">暂无专题</div>';
    document.getElementById('sgCount').textContent='信号线 '+total+' 条进行中 · "新"= 最新一期内有更新 · 点行进入信号页';
    var sigList=document.getElementById('sigList');var rowsO=[].slice.call(sigList.querySelectorAll('.tp-row'));
    var fwChip=document.getElementById('fwChip'),fwN=document.getElementById('fwN'),fwView=false;
    function fwCount(){var L=(window.__fwList?window.__fwList():{list:[]}).list||[];fwN.textContent=L.length?(' '+L.length):'';}
    function setView(on){
      fwView=on;fwChip.setAttribute('aria-pressed',on?'true':'false');fwChip.classList.toggle('fw-on',on);
      [].slice.call(sigList.querySelectorAll('.fw-dead')).forEach(function(el){if(el.parentNode)el.parentNode.removeChild(el)});
      var es=document.getElementById('fwEmpty');if(es&&es.parentNode)es.parentNode.removeChild(es);
      [].slice.call(sigList.querySelectorAll('.tp-row')).forEach(function(el){el.style.display='none';el.classList.remove('fw-sel')});
      if(!on){rowsO.forEach(function(el){el.style.display='';sigList.appendChild(el);});fwCount();return;}
      var L=((window.__fwList&&window.__fwList())||{list:[]}).list||[];var have={};
      [].slice.call(sigList.querySelectorAll('.tp-row')).forEach(function(el){have[el.getAttribute('data-sig')]=el});
      var kept=0;
      L.slice().reverse().forEach(function(x){var el=have[x.id];if(el){el.style.display='';el.classList.add('fw-sel');sigList.appendChild(el);kept++;}});
      L.slice().reverse().forEach(function(x){if(!have[x.id]){var d=document.createElement('div');d.className='tp-row fw-dead';d.innerHTML='<span class="tp-dot d"></span><span class="tp-name">'+esc(x.n||x.id)+'</span><span class="tp-meta">档案已移除</span>';sigList.appendChild(d);kept++;}});
      if(!kept)sigList.insertAdjacentHTML('beforeend','<div class="tp-ph" id="fwEmpty">还没有关注的信号——在期报页或任意专题页点亮 ☆</div>');
      fwCount();
    }
    fwChip.addEventListener('click',function(e){e.preventDefault();setView(!fwView);});
    document.addEventListener('followchange',function(){fwCount();if(fwView)setView(true);});
    window.__fwHyd&&window.__fwHyd();
    fwCount();
  }).catch(function(){document.getElementById('sgCount').textContent='专题数据加载失败';document.getElementById('sigList').innerHTML='';});
})();
</script>
<script>(function(){var b=document.getElementById("nvBtn"),n=document.getElementById("nv");if(b&&n){b.addEventListener("click",function(e){e.stopPropagation();n.classList.toggle("open")});document.addEventListener("click",function(e){if(!n.contains(e.target)&&!b.contains(e.target))n.classList.remove("open")});}})();</script>
<script>(function(){var K="aiintelfollow",HK="aiintelfollowhint";function rd(){try{var d=JSON.parse(localStorage.getItem(K)||"");if(d&&d.v===1&&Array.isArray(d.list))return d}catch(e){}return{v:1,list:[]}}function wr(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}function has(id){return rd().list.some(function(x){return x.id===id})}function tn(){try{var d=JSON.parse(localStorage.getItem(HK)||"{}");return(d&&d.n)||0}catch(e){return 0}}function paint(el){var on=has(el.getAttribute("data-fw"));el.classList.toggle("fw-on",on);el.setAttribute("aria-pressed",on?"true":"false");el.textContent=on?"★":"☆";el.title=on?"取消关注":"关注这个信号"}function hyd(){var els=document.querySelectorAll("[data-fw]");for(var i=0;i<els.length;i++)paint(els[i])}function toast(){var t=document.createElement("div");t.className="fw-toast";t.textContent="⭐ 关注仅保存在当前浏览器，更换浏览器或设备后不会保留";document.body.appendChild(t);setTimeout(function(){t.classList.add("fw-out")},3600);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},4200)}document.addEventListener("click",function(ev){var el=ev.target?ev.target.closest("[data-fw]"):null;if(!el)return;ev.preventDefault();ev.stopPropagation();var id=el.getAttribute("data-fw"),name=el.getAttribute("data-name")||"";var d=rd(),i=-1,j;for(j=0;j<d.list.length;j++)if(d.list[j].id===id){i=j;break}var on;if(i>=0){d.list.splice(i,1);on=false}else{d.list.push({id:id,n:String(name),t:Date.now()});on=true}wr(d);paint(el);if(on&&tn()<3){try{localStorage.setItem(HK,JSON.stringify({n:tn()+1}))}catch(e){}toast()}try{document.dispatchEvent(new CustomEvent("followchange",{detail:{id:id,on:on}}))}catch(e){}});window.addEventListener("storage",function(e){if(!e||(e.key===K))hyd()});if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",hyd);else hyd();window.__fwHyd=hyd;window.__fwHas=has;window.__fwList=rd;})();</script>
</body>
</html>
