<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情报 · 日报归档</title>
<meta name="description" content="AI 行业情报日报档案 — 由 Agent 自动采集生成：产品发布/融资、技术突破、政策监管、行业动向">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%230c0d10'/><circle cx='50' cy='50' r='10' fill='%23e8a33d'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23e8a33d' stroke-width='3' opacity='.6'/><circle cx='50' cy='50' r='40' fill='none' stroke='%23e8a33d' stroke-width='2' opacity='.25'/></svg>">
<style>
:root{
  --bg:#0c0d10; --bg2:#101218; --panel:#15171e; --panel2:#191c24;
  --line:#262a33; --line2:#31353f;
  --ink:#d8d5c9; --ink2:#a5a294; --dim:#77746a;
  --amber:#e8a33d; --amber2:#f5c069; --green:#8cc07a; --red:#d0684f;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:
    repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.008) 2px 4px),
    radial-gradient(ellipse 120% 80% at 50% -10%,#13161e 0%,var(--bg) 58%);
  color:var(--ink);font-family:var(--sans);min-height:100vh;
  font-size:15px;line-height:1.65;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* ==== masthead ==== */
.masthead{padding:52px 0 26px;position:relative}
.mh-meta{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.mh-meta .dot{color:var(--amber)}
.brand{display:flex;align-items:baseline;gap:14px;margin:14px 0 6px;flex-wrap:wrap}
.brand h1{font-size:34px;font-weight:800;letter-spacing:.06em}
.brand h1 em{font-style:normal;color:var(--amber)}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.18em;border:1px solid var(--line2);padding:3px 8px;border-radius:3px;transform:translateY(-4px)}
.tagline{color:var(--ink2);font-size:13.5px;max-width:56ch}
.statline{margin-top:18px;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--panel),transparent);font-family:var(--mono);font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statline b{color:var(--amber);font-weight:600}
.statline .sep{color:var(--line2)}

/* ==== list ==== */
.issues{margin:6px 0 30px;display:flex;flex-direction:column;gap:10px}
.day{position:relative;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;transition:border-color .25s,transform .25s;
  animation:up .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*.045s)}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2);transition:background .25s}
.day:hover{border-color:#3a3f4c;transform:translateY(-1px)}
.day:hover::before{background:var(--amber)}
.day a{display:block;padding:16px 18px 15px;color:inherit;text-decoration:none}
.d-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.d-date{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:.02em}
.d-date small{font-size:12px;color:var(--dim);font-weight:400;margin-left:2px}
.d-time{font-family:var(--mono);font-size:11px;color:var(--bg);background:var(--amber);padding:2px 7px;border-radius:3px;letter-spacing:.1em;font-weight:600}
.d-time.night{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.d-count{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-left:auto;letter-spacing:.06em}
.d-count b{color:var(--ink);font-weight:600}
.d-teaser{margin-top:7px;color:var(--ink2);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d-teaser::before{content:"— ";color:var(--dim)}
.d-chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink2);border:1px solid var(--line2);padding:1.5px 7px;border-radius:3px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.day{animation:none}}

/* ==== footer / misc ==== */
.foot{padding:26px 0 40px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:var(--dim)}
.msg{padding:60px 0;text-align:center;color:var(--dim);font-family:var(--mono);font-size:13px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:10px;animation:pulse 1.6s ease-in-out infinite;vertical-align:1px}
@keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="mh-meta"><span>INTEL·DAILY</span><span class="dot">◉</span><span>AI INTELLIGENCE BRIEFING</span><span>ASIA/SHANGHAI</span></div>
    <div class="brand"><h1>AI <em>情报</em>日报</h1><span class="sub">ARCHIVE</span></div>
    <p class="tagline">面向创业者的 AI 行业情报简报——产品发布会/融资、技术突破、政策监管、行业动向与应用玩法。每天 09:00 / 15:00 / 21:00 三期，由 Agent 自动采集定稿。</p>
    <div class="statline" id="statline"><span><span class="pulse"></span>加载归档索引…</span></div>
  </header>

  <main class="issues" id="issues"></main>

  <footer class="foot">
    <span>agent-engineered · data from reports/raw archive</span>
    <a href="https://github.com/janseling/ainres-report.github.io" target="_blank" rel="noopener">github/janseling</a>
  </footer>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEC_LABEL = {product:'📦 产品', tech:'🔬 技术', policy:'🏛️ 政策', industry:'🌐 行业'};

async function init(){
  try{
    const r = await fetch('reports/index.json?v=' + Date.now());
    if(!r.ok) throw new Error(r.status);
    const m = await r.json();
    if(!m.reports || !m.reports.length) throw new Error('empty');
    render(m);
  }catch(e){
    document.getElementById('statline').innerHTML = '<span>⚠️ 归档索引加载失败（' + esc(e.message) + '），稍后刷新重试</span>';
  }
}

function render(m){
  const rs = m.reports;
  const total = rs.reduce((a,x)=>a+(x.itemCount||0),0);
  const cand = rs.reduce((a,x)=>a+((x.rawStats&&x.rawStats.candidates)||0),0);
  document.getElementById('statline').innerHTML =
    `<span>共 <b>${rs.length}</b> 期</span><span class="sep">│</span>`+
    `<span>入库 <b>${total}</b> 条</span><span class="sep">│</span>`+
    `<span>累计扫读候选 <b>${cand.toLocaleString()}</b> 条</span><span class="sep">│</span>`+
    `<span>最新一期 <b>${esc(rs[0].date)} ${esc(rs[0].time)}</b></span>`;

  document.getElementById('issues').innerHTML = rs.map((x,i)=>{
    const hour = parseInt(x.time.slice(0,2),10);
    const wd = new Date(x.date + 'T' + x.time + ':00+08:00').toLocaleDateString('zh-CN',{weekday:'short'});
    const chips = Object.entries(x.sectionCounts||{}).map(([k,n])=>`<span class="chip">${SEC_LABEL[k]||k} ${n}</span>`).join('');
    const teasers = (x.overview||[]).slice(0,2).map(esc).join('<br>');
    return `<article class="day" style="--i:${i}">
      <a href="report.html?id=${esc(x.id)}">
        <div class="d-head">
          <span class="d-date">${esc(x.date.slice(5))}<small> ${esc(wd)}</small></span>
          <span class="d-time${hour>=19?' night':''}">${esc(x.time)} 场</span>
          <span class="d-count"><b>${x.itemCount}</b> 条 · ${x.rawStats&&x.rawStats.candidates?'候选 '+(x.rawStats.candidates).toLocaleString():''}</span>
        </div>
        <p class="d-teaser">${teasers||esc(x.coverage||'')}</p>
        <div class="d-chips">${chips}</div>
      </a>
    </article>`;
  }).join('');
}
init();
</script>
</body>
</html>
