<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情报 · 日报归档</title>
<meta name="description" content="AI 行业情报日报档案 — 由 Agent 自动采集生成：产品发布/融资、技术突破、政策监管、行业动向">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%230c0d10'/><circle cx='50' cy='50' r='10' fill='%23e8a33d'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23e8a33d' stroke-width='3' opacity='.6'/><circle cx='50' cy='50' r='40' fill='none' stroke='%23e8a33d' stroke-width='2' opacity='.25'/></svg>">
<style>
:root{
  --bg:#0c0d10; --bg2:#101218; --panel:#15171e; --panel2:#191c24;
  --line:#262a33; --line2:#31353f;
  --ink:#d8d5c9; --ink2:#a5a294; --dim:#77746a;
  --amber:#e8a33d; --amber2:#f5c069; --green:#8cc07a; --red:#d0684f;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:
    repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.008) 2px 4px),
    radial-gradient(ellipse 120% 80% at 50% -10%,#13161e 0%,var(--bg) 58%);
  color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:15px;line-height:1.65;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ==== masthead ==== */
.masthead{padding:52px 0 26px}
.mh-meta{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.mh-meta .dot{color:var(--amber)}
.brand{display:flex;align-items:baseline;gap:14px;margin:14px 0 6px;flex-wrap:wrap}
.brand h1{font-size:34px;font-weight:800;letter-spacing:.06em}
.brand h1 em{font-style:normal;color:var(--amber)}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.18em;border:1px solid var(--line2);padding:3px 8px;border-radius:3px;transform:translateY(-4px)}
.tagline{color:var(--ink2);font-size:13.5px;max-width:60ch}
.statline{margin-top:18px;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--panel),transparent);font-family:var(--mono);font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statline b{color:var(--amber);font-weight:600}
.statline .sep{color:var(--line2)}

/* ==== day rows ==== */
.dayrow{margin:14px 0 0;animation:up .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*.05s)}
.row-h{display:flex;align-items:baseline;gap:12px;padding:12px 2px 8px}
.d-date{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.02em}
.d-wd{font-size:12px;color:var(--dim)}
.row-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.d-prog{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.05em}
.d-prog b{color:var(--amber);font-weight:600}

.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ==== cards ==== */
.slot-card{display:flex;flex-direction:column;position:relative;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;transition:border-color .25s,transform .25s}
.slot-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2);transition:background .25s}
a.slot-card{color:inherit;text-decoration:none}
a.slot-card:hover{border-color:#3a3f4c;transform:translateY(-1px)}
a.slot-card:hover::before{background:var(--amber)}
.slot-card.empty{border-style:dashed;background:transparent;opacity:.75}
.slot-card.empty::before{background:transparent}

.sc-head{display:flex;align-items:baseline;gap:8px;padding:12px 14px 0}
.sc-time{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;font-weight:600;background:var(--amber);color:var(--bg)}
.sc-time.night{background:transparent;border:1px solid var(--amber);color:var(--amber)}
.sc-time.dim{background:transparent;border:1px dashed var(--line2);color:var(--dim);font-weight:400}
.sc-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.sc-count b{color:var(--ink);font-weight:600}

.sc-ov{flex:1 1 auto;padding:9px 14px 13px;display:flex;flex-direction:column;gap:6px}
.sc-ov li{list-style:none;position:relative;padding-left:13px;color:var(--ink2);font-size:12.5px;line-height:1.58}
.sc-ov li::before{content:"·";position:absolute;left:0;top:0;color:var(--amber);font-weight:700}
.sc-ph{padding:16px 14px 18px;font-family:var(--mono);font-size:11px;color:#4a4d55;letter-spacing:.14em;text-align:center}
.sc-tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 12px;}
.sc-tags span{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:3px 7px;display:inline-flex;align-items:center;white-space:nowrap}
.sc-tags span::first-letter{font-size:11.5px}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dayrow{animation:none}}

@media (max-width:720px){
  .slotgrid{grid-template-columns:1fr}
  .sc-ov li{font-size:13px}
}

/* ==== footer / misc ==== */
.foot{padding:26px 0 40px;border-top:1px solid var(--line);margin-top:30px;color:var(--dim);font-size:12px;font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:var(--dim)}
.msg{padding:60px 0;text-align:center;color:var(--dim);font-family:var(--mono);font-size:13px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:10px;animation:pulse 1.6s ease-in-out infinite;vertical-align:1px}
@keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="mh-meta"><span>INTEL·DAILY</span><span class="dot">◉</span><span>AI INTELLIGENCE BRIEFING</span><span>ASIA/SHANGHAI</span></div>
    <div class="brand"><h1>AI <em>情报</em>日报</h1><span class="sub">ARCHIVE</span></div>
    <p class="tagline">面向创业者的 AI 行业情报简报——产品发布/融资、技术突破、政策监管、行业动向与应用玩法。每天 09:00 / 15:00 / 21:00 三期，由 Agent 自动采集定稿。</p>
    <div class="statline" id="statline"><span><span class="pulse"></span>加载归档索引…</span></div>
  </header>

  <main id="days"></main>

  <footer class="foot">
    <span>ai-intel-daily · agent-collected briefing</span>
    <a href="https://github.com/janseling" target="_blank" rel="noopener">github/janseling</a>
  </footer>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLOTS = [540, 900, 1260];           // 09:00 / 15:00 / 21:00（分钟）
const SLOT_LABEL = ['09:00 场', '15:00 场', '21:00 场'];
const TAGS = { product:['📦','产品'], tech:['🔬','技术'], policy:['🏛️','政策'], industry:['🌐','行业'] };

const toMin = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60 + (m||0); };
const slotDist = t => SLOTS.map(s => Math.abs(toMin(t) - s));
const wdOf = d => new Date(d + 'T12:00:00+08:00').toLocaleDateString('zh-CN', { weekday: 'short' });

async function init(){
  try{
    const r = await fetch('reports/index.json?v=' + Date.now());
    if(!r.ok) throw new Error(r.status);
    const m = await r.json();
    if(!m.reports || !m.reports.length) throw new Error('empty');
    render(m);
  }catch(e){
    document.getElementById('statline').innerHTML = '<span>⚠️ 归档索引加载失败（' + esc(e.message) + '），稍后刷新重试</span>';
  }
}

function render(m){
  const rs = m.reports; // 已按 id 降序（新→旧）
  const total = rs.reduce((a,x)=>a+(x.itemCount||0),0);
  const cand = rs.reduce((a,x)=>a+((x.rawStats&&x.rawStats.candidates)||0),0);
  document.getElementById('statline').innerHTML =
    `<span>共 <b>${rs.length}</b> 期</span><span class="sep">│</span>`+
    `<span>入库 <b>${total}</b> 条</span><span class="sep">│</span>`+
    `<span>累计扫读候选 <b>${cand.toLocaleString()}</b> 条</span><span class="sep">│</span>`+
    `<span>最新一期 <b>${esc(rs[0].date)} ${esc(rs[0].time)}</b></span>`;

  /* 按日期分组 + 槽位分配（同槽冲突时顺延到最近空槽） */
  const byDate = new Map();
  for (const x of rs){
    if (!byDate.has(x.date)) byDate.set(x.date, []);
    byDate.get(x.date).push(x);
  }
  for (const arr of byDate.values()) arr.sort((a,b)=>a.time<b.time?-1:1);

  /* 日期轴：最新报告日期 与 今天 取较大者，回溯到最早报告日期 */
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' }); // YYYY-MM-DD
  const latest = rs[0].date > today ? rs[0].date : today;
  const dates = [];
  for (let d = latest; d >= rs[rs.length-1].date; ){
    dates.push(d);
    const p = new Date(d + 'T12:00:00+08:00'); p.setDate(p.getDate()-1);
    d = p.toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
  }

  document.getElementById('days').innerHTML = dates.map((d,i)=>{
    const list = byDate.get(d) || [];
    const slots = new Array(3).fill(null);
    for (const x of list){
      const order = slotDist(x.time).map((dist,si)=>[dist,si]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);
      for (const si of order){ if (!slots[si]) { slots[si] = x; break; } }
    }
    const n = list.length;
    const itemCount = list.reduce((a,x)=>a+(x.itemCount||0),0);
    const cards = slots.map((x,si)=>{
      if (x){
        const hour = parseInt(x.time.slice(0,2),10);
        const ov = (x.overview||[]).map(o=>`<li>${esc(o)}</li>`).join('');
        const tagHtml = Object.entries(TAGS).filter(([k])=>x.sectionCounts&&x.sectionCounts[k])
          .map(([k,[ic,zh]])=>`<span>${ic} ${zh} ${x.sectionCounts[k]}</span>`).join('');
        return `<a class="slot-card" href="report.html?id=${esc(x.id)}">
          <div class="sc-head"><span class="sc-time${hour>=19?' night':''}">${esc(x.time)} 场</span><span class="sc-count"><b>${x.itemCount||'-'}</b> 条</span></div>
          <ul class="sc-ov">${ov||'<li>（本期无速览）</li>'}</ul>
          ${tagHtml?`<div class="sc-tags">${tagHtml}</div>`:''}
        </a>`;
      }
      return `<div class="slot-card empty">
        <div class="sc-head"><span class="sc-time dim">${SLOT_LABEL[si]}</span></div>
        <div class="sc-ph">— 未出刊 —</div>
      </div>`;
    }).join('');
    return `<section class="dayrow" style="--i:${i}">
      <div class="row-h">
        <span class="d-date">${esc(d.slice(5))}</span><span class="d-wd">${wdOf(d)}</span>
        <span class="row-line"></span>
        <span class="d-prog">${n?`已出 <b>${n}</b>/3 期 · ${itemCount} 条`: '待出刊'}</span>
      </div>
      <div class="slotgrid">${cards}</div>
    </section>`;
  }).join('');
}
init();
</script>
</body>
</html>
